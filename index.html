document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

soft); text-wrap:pretty;\">Every tool writes into one format. An AI layer reads the stream live, links cause to effect, and routes what matters — to a human, or to an agent.<\u002Fp>\n\n        <div ref=\"{{ pipeMount }}\" data-reveal=\"\" data-delay=\"220\" style=\"padding:clamp(22px,3vw,34px); border:1px solid var(--line); border-radius:20px; background:rgba(7,10,18,.78); backdrop-filter:blur(12px);\">\n          <div style=\"display:flex; align-items:baseline; justify-content:space-between; gap:16px; flex-wrap:wrap; margin-bottom:26px;\">\n            <div style=\"font-family:'JetBrains Mono',monospace; font-size:11px; letter-spacing:.16em; text-transform:uppercase; color:var(--faint);\">one event, six stations<\u002Fdiv>\n            <div style=\"font-size:15px; color:var(--ink);\">{{ reachText }}<\u002Fdiv>\n          <\u002Fdiv>\n\n          <div style=\"position:relative; margin-bottom:26px;\">\n            <div style=\"position:absolute; left:0; right:0; top:13px; height:1px; background:var(--line);\"><\u002Fdiv>\n            <div ref=\"{{ trackMount }}\" style=\"position:absolute; left:0; top:13px; height:1px; width:0%; background:linear-gradient(90deg,var(--a1),var(--a3)); transition:width .25s ease-out;\"><\u002Fdiv>\n            <div ref=\"{{ dotMount }}\" style=\"position:absolute; top:9px; left:0; width:9px; height:9px; margin-left:-4px; border-radius:50%; background:#eafcff; box-shadow:0 0 14px var(--a1); opacity:0; will-change:transform;\"><\u002Fdiv>\n            <div style=\"position:relative; display:grid; grid-template-columns:repeat(6,minmax(0,1fr));\">\n              <sc-for list=\"{{ stations }}\" as=\"st\" hint-placeholder-count=\"6\">\n                <div data-station=\"\" style=\"display:flex; flex-direction:column; align-items:center; gap:12px; text-align:center;\">\n                  <span data-lamp=\"\" style=\"width:11px; height:11px; border-radius:50%; background:#1b2230; border:1px solid rgba(255,255,255,.16); transition:background . g more meetings and more forwarding.<\u002Fp>\n        <\u002Fdiv>\n        <div ref=\"{{ chartCardMount }}\" data-reveal=\"\" data-delay=\"200\" style=\"padding:clamp(24px,3vw,34px); border:1px solid var(--line); border-radius:20px; background:rgba(7,10,18,.78); backdrop-filter:blur(12px);\">\n          <svg sc-camel-view-box=\"0 0 320 132\" width=\"100%\" height=\"auto\" role=\"img\" aria-label=\"Coordination effort against headcount: it climbs steeply today and stays nearly flat with Nexus.\" style=\"display:block; overflow:visible;\">\n            <line x1=\"6\" y1=\"112\" x2=\"314\" y2=\"112\" stroke=\"rgba(255,255,255,.12)\" stroke-width=\"1\"><\u002Fline>\n            <line x1=\"6\" y1=\"112\" x2=\"6\" y2=\"8\" stroke=\"rgba(255,255,255,.12)\" stroke-width=\"1\"><\u002Fline>\n            <path ref=\"{{ pathAMount }}\" d=\"M6 108 C 96 104, 168 74, 232 40 S 292 13, 314 7\" fill=\"none\" stroke=\"#5d6577\" stroke-width=\"1.7\" stroke-linecap=\"round\"><\u002Fpath>\n            <path ref=\"{{ pathBMount }}\" d=\"M6 108 C 96 103, 190 96, 314 90\" fill=\"none\" stroke=\"#22d3ee\" stroke-width=\"2.2\" stroke-linecap=\"round\"><\u002Fpath>\n            <circle ref=\"{{ dotAMount }}\" cx=\"314\" cy=\"7\" r=\"2.8\" fill=\"#5d6577\" opacity=\"0\"><\u002Fcircle>\n            <circle ref=\"{{ dotBMount }}\" cx=\"314\" cy=\"90\" r=\"3.2\" fill=\"#22d3ee\" opacity=\"0\"><\u002Fcircle>\n            <text x=\"6\" y=\"128\" fill=\"#5b6376\" font-family=\"JetBrains Mono, monospace\" font-size=\"8.5\" letter-spacing=\"1.4\">HEADCOUNT →<\u002Ftext>\n          <\u002Fsvg>\n          <div style=\"display:flex; flex-wrap:wrap; gap:18px; margin-top:16px; font-family:'JetBrains Mono',monospace; font-size:10.5px; letter-spacing:.1em; color:var(--faint);\">\n            <span style=\"display:flex; align-items:center; gap:7px;\"><span style=\"width:14px; height:2px; background:#5d6577;\"><\u002Fspan>coordination today<\u002Fspan>\n            <span style=\"display:flex; align-items:center; gap:7px;\"><span style=\"width:14px; height:2px; background:var(--a1);\"><\u002Fspan>with Nexus<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <section data-sec=\"5\" data-screen-label=\"Close\" style=\"position:relative; z-index:2; min-height:92vh; display:flex; align-items:center; padding:clamp(96px,12vw,180px) clamp(20px,5vw,64px); overflow:hidden;\">\n      <div style=\"position:absolute; inset:0; background:radial-gradient(70% 60% at 50% 40%, rgba(34,211,238,.1), transparent 66%); pointer-events:none;\"><\u002Fdiv>\n      <div style=\"position:relative; max-width:820px; margin:0 auto; text-align:center; display:flex; flex-direction:column; align-items:center; gap:28px;\">\n        <h2 data-reveal=\"\" style=\"margin:0; font-weight:600; letter-spacing:-.038em; line-height:1; font-size:clamp(38px,6.4vw,86px); color:var(--ink); text-wrap:balance;\">Ready to activate your corporate synapse?<\u002Fh2>\n        <a data-reveal=\"\" data-delay=\"120\" href=\"mailto:stefanlietz71@gmail.com?subject=Nexus\" style=\"display:inline-flex; align-items:center; gap:10px; padding:16px 30px; border-radius:999px; font-weight:600; font-size:16px; color:#03121a; background:linear-gradient(135deg,var(--a1),var(--a2)); box-shadow:0 12px 40px rgba(34,211,238,.3); transition:transform .2s, box-shadow .2s;\" style-hover=\"transform:translateY(-2px); box-shadow:0 18px 50px rgba(34,211,238,.44);\">Initialize Synapse <span style=\"font-size:17px;\">→<\u002Fspan><\u002Fa>\n        <div data-reveal=\"\" data-delay=\"200\" style=\"display:flex; flex-direction:column; gap:8px; font-family:'JetBrains Mono',monospace; font-size:12px; letter-spacing:.08em; color:var(--soft);\">\n          <span>Already running — not roadmap.<\u002Fspan>\n          <span style=\"color:var(--faint);\">Stefan Lietz · Nexus<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n  <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ isCompanies }}\" hint-placeholder-val=\"{{ false }}\">\n  <div>\n    <section data-screen-label=\"Companies intro\" style=\"padding:clamp(120px,15vh,180px) clamp(20px,5vw,64px) clamp(60px,8vw,90px);\">\n      <div style=\"max-width:1160px; margin:0 auto;\">\n        <div data-reveal=\"\" style=\"font-family:'JetBrains Mono',monospace; font-size:11.5px; letter-spacing:.16em; text-transform:uppercase; color:var(--a1); margin-bottom:18px;\">// for companies<\u002Fdiv>\n        <h1 data-reveal=\"\" data-delay=\"80\" style=\"margin:0 0 22px; max-width:22ch; font-weight:600; letter-spacing:-.036em; line-height:1.02; font-size:clamp(34px,5.4vw,72px); color:var(--ink); text-wrap:balance;\">Onboarding guide for your team.<\u002Fh1>\n        <p data-reveal=\"\" data-delay=\"150\" style=\"margin:0; max-width:680px; font-size:clamp(15px,1.2vw,18px); line-height:1.7; color:var(--soft); text-wrap:pretty;\">For companies newly invited to Nexus, or setting up their workspace. It explains what each page is for, and how you connect your own tools, repositories and channels.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <section data-screen-label=\"Journey\" style=\"padding:clamp(60px,8vw,110px) clamp(20px,5vw,64px); background:#080c16; border-top:1px solid var(--line);\">\n      <div style=\"max-width:1160px; margin:0 auto;\">\n        <h2 data-reveal=\"\" style=\"margin:0 0 clamp(34px,5vw,54px); font-weight:600; letter-spacing:-.028em; font-size:clamp(26px,3.4vw,42px); color:var(--ink);\">The five-step journey<\u002Fh2>\n        <div style=\"display:flex; flex-direction:column; gap:2px;\">\n          <sc-for list=\"{{ journey }}\" as=\"j\" hint-placeholder-count=\"5\">\n            <div data-reveal=\"\" data-delay=\"{{ j.delay }}\" style=\"display:grid; grid-template-columns:minmax(0,74px) minmax(0,1fr); gap:clamp(16px,3vw,40px); align-items:start; padding:26px 0; border-top:1px solid var(--line);\">\n              <span style=\"font-family:'JetBrains Mono',monospace; font-size:clamp(22px,2.6vw,32px); line-height:1; color:rgba(34,211,238,.5);\">{{ j.n }}<\u002Fspan>\n              <div>\n                <div style=\"font-weight:600; font-size:clamp(17px,1.6vw,21px); letter-spacing:-.015em; color:var(--ink); margin-bottom:8px;\">{{ j.title }}<\u002Fdiv>\n                <div style=\"max-width:620px; font-size:15px; line-height:1.65; color:var(--soft); text-wrap:pretty;\">{{ j.text }}<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <section data-screen-label=\"Pages\" style=\"padding:clamp(60px,8vw,110px) clamp(20px,5vw,64px);\">\n      <div style=\"max-width:1160px; margin:0 auto;\">\n        <h2 data-reveal=\"\" style=\"margin:0 0 14px; font-weight:600; letter-spacing:-.028em; font-size:clamp(26px,3.4vw,42px); color:var(--ink);\">What each page is for<\u002Fh2>\n        <p data-reveal=\"\" data-delay=\"70\" style=\"margin:0 0 clamp(30px,4vw,46px); max-width:600px; font-size:15.5px; line-height:1.65; color:var(--soft);\">Ten screens, one job each.<\u002Fp>\n        <div style=\"display:grid; grid-template-columns:repeat(auto-fit,minmax(280px,1fr)); gap:16px;\">\n          <sc-for list=\"{{ pages }}\" as=\"pg\" hint-placeholder-count=\"10\">\n            <div data-reveal=\"\" data-delay=\"{{ pg.delay }}\" style=\"padding:22px 20px; border:1px solid var(--line); border-radius:16px; background:var(--card);\">\n              <div style=\"display:flex; align-items:baseline; justify-content:space-between; gap:12px; margin-bottom:10px;\">\n                <span style=\"font-weight:600; font-size:15.5px; letter-spacing:-.01em; color:var(--ink);\">{{ pg.name }}<\u002Fspan>\n                <span style=\"font-family:'JetBrains Mono',monospace; font-size:11px; color:var(--a1);\">{{ pg.url }}<\u002Fspan>\n              <\u002Fdiv>\n              <div style=\"font-size:14px; line-height:1.6; color:var(--soft); text-wrap:pretty;\">{{ pg.text }}<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <section data-screen-label=\"Connect tools\" style=\"padding:clamp(60px,8vw,110px) clamp(20px,5vw,64px); background:#080c16; border-top:1px solid var(--line);\">\n      <div style=\"max-width:1160px; margin:0 auto;\">\n        <h2 data-reveal=\"\" style=\"margin:0 0 14px; font-weight:600; letter-spacing:-.028em; font-size:clamp(26px,3.4vw,42px); color:var(--ink);\">Connect your own tools<\u002Fh2>\n        <p data-reveal=\"\" data-delay=\"70\" style=\"margin:0 0 clamp(30px,4vw,46px); max-width:660px; font-size:15.5px; line-height:1.7; color:var(--soft); text-wrap:pretty;\">Anything that can send a webhook can feed the Synapse — Linear, Jira, your own internal systems. GitHub and Slack simply carry an extra built-in signature check, because they are the most common.<\u002Fp>\n\n        <div style=\"display:grid; grid-template-columns:repeat(auto-fit,minmax(300px,1fr)); gap:20px; align-items:start;\">\n          <div data-reveal=\"\" data-delay=\"120\" style=\"padding:24px; border:1px solid var(--line); border-radius:16px; background:rgba(5,7,13,.5);\">\n            <div style=\"font-family:'JetBrains Mono',monospace; font-size:10.5px; letter-spacing:.14em; text-transform:uppercase; color:var(--faint); margin-bottom:14px;\">payload url<\u002Fdiv>\n            <code style=\"display:block; font-family:'JetBrains Mono',monospace; font-size:12.5px; line-height:1.8; color:#c9d1de; word-break:break-all;\">https://&lt;your-nexus-domain&gt;/api/dna/synapse<wbr>?source=&lt;source&gt;&amp;dnaId=&lt;your-dnaId&gt;<\u002Fcode>\n            <div style=\"margin-top:20px; display:flex; flex-direction:column; gap:12px;\">\n              <sc-for list=\"{{ sources }}\" as=\"src\" hint-placeholder-count=\"3\">\n                <div style=\"display:flex; gap:12px; align-items:baseline;\">\n                  <span style=\"font-family:'JetBrains Mono',monospace; font-size:12px; color:var(--a1); white-space:nowrap;\">{{ src.key }}<\u002Fspan>\n                  <span style=\"font-size:14px; line-height:1.6; color:var(--soft); text-wrap:pretty;\">{{ src.text }}<\u002Fspan>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div data-reveal=\"\" data-delay=\"180\" style=\"padding:24px; border:1px solid var(--line); border-radius:16px; background:rgba(5,7,13,.5);\">\n            <div style=\"font-family:'JetBrains Mono',monospace; font-size:10.5px; letter-spacing:.14em; text-transform:uppercase; color:var(--faint); margin-bottom:14px;\">ideal json payload<\u002Fdiv>\n            <pre style=\"margin:0; font-family:'JetBrains Mono',monospace; font-size:12.5px; line-height:1.75; color:#c9d1de; white-space:pre-wrap;\">{\n  \"actor\":    who triggered the event\n  \"type\":     the action, e.g. issue_created\n  \"content\":  a human-readable summary\n  \"metadata\": any structural extras\n}<\u002Fpre>\n            <p style=\"margin:18px 0 0; font-size:14px; line-height:1.6; color:var(--soft); text-wrap:pretty;\">All fields optional. Without them the event is still stored — the feed then shows “unknown” as the actor and the raw JSON as content.<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <section data-screen-label=\"Roles\" style=\"padding:clamp(60px,8vw,110px) clamp(20px,5vw,64px);\">\n      <div style=\"max-width:1160px; margin:0 auto;\">\n        <h2 data-reveal=\"\" style=\"margin:0 0 clamp(30px,4vw,46px); font-weight:600; letter-spacing:-.028em; font-size:clamp(26px,3.4vw,42px); color:var(--ink);\">Roles in your team<\u002Fh2>\n        <div style=\"display:grid; grid-template-columns:repeat(auto-fit,minmax(280px,1fr)); gap:20px;\">\n          <sc-for list=\"{{ roles }}\" as=\"r\" hint-placeholder-count=\"2\">\n            <div data-reveal=\"\" data-delay=\"{{ r.delay }}\" style=\"padding:26px 24px; border:1px solid var(--line); border-radius:16px; background:var(--card);\">\n              <div style=\"font-weight:600; font-size:19px; letter-spacing:-.015em; color:var(--ink); margin-bottom:16px;\">{{ r.name }}<\u002Fdiv>\n              <div style=\"display:flex; flex-direction:column; gap:11px;\">\n                <sc-for list=\"{{ r.items }}\" as=\"it\" hint-placeholder-count=\"4\">\n                  <div style=\"display:flex; gap:11px; align-items:baseline; font-size:14.5px; line-height:1.6; color:var(--soft);\">\n                    <span style=\"color:var(--a1); flex:0 0 auto;\">✓<\u002Fspan><span style=\"text-wrap:pretty;\">{{ it }}<\u002Fspan>\n                  <\u002Fdiv>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <div data-reveal=\"\" data-delay=\"200\" style=\"margin-top:clamp(34px,5vw,52px); padding:26px 24px; border:1px solid var(--line); border-radius:16px; background:rgba(34,211,238,.05);\">\n          <div style=\"font-weight:600; font-size:17px; color:var(--ink); margin-bottom:8px;\">Questions on setup?<\u002Fdiv>\n          <p style=\"margin:0; max-width:620px; font-size:15px; line-height:1.65; color:var(--soft);\">For webhook configuration or registering agents via manifest, talk to your Nexus contact — <a href=\"mailto:stefanlietz71@gmail.com?subject=Nexus%20onboarding\">stefanlietz71@gmail.com<\u002Fa>.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n  <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ isPlatform }}\" hint-placeholder-val=\"{{ false }}\">\n  <div>\n    <section data-screen-label=\"Platform intro\" style=\"padding:clamp(120px,15vh,180px) clamp(20px,5vw,64px) clamp(60px,8vw,90px);\">\n      <div style=\"max-width:1160px; margin:0 auto;\">\n        <div data-reveal=\"\" style=\"font-family:'JetBrains Mono',monospace; font-size:11.5px; letter-spacing:.16em; text-transform:uppercase; color:var(--a1); margin-bottom:18px;\">// platform<\u002Fdiv>\n        <h1 data-reveal=\"\" data-delay=\"80\" style=\"margin:0 0 22px; max-width:22ch; font-weight:600; letter-spacing:-.036em; line-height:1.02; font-size:clamp(34px,5.4vw,72px); color:var(--ink); text-wrap:balance;\">How the operating layer is built.<\u002Fh1>\n        <p data-reveal=\"\" data-delay=\"150\" style=\"margin:0; max-width:680px; font-size:clamp(15px,1.2vw,18px); line-height:1.7; color:var(--soft); text-wrap:pretty;\">Four pillars, one execution layer, and a trust model that starts every agent on a short leash.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <section data-screen-label=\"Pillars\" style=\"padding:clamp(60px,8vw,110px) clamp(20px,5vw,64px); background:#080c16; border-top:1px solid var(--line);\">\n      <div style=\"max-width:1160px; margin:0 auto;\">\n        <h2 data-reveal=\"\" style=\"margin:0 0 clamp(30px,4vw,46px); font-weight:600; letter-spacing:-.028em; font-size:clamp(26px,3.4vw,42px); color:var(--ink);\">The four core pillars<\u002Fh2>\n        <div style=\"display:grid; grid-template-columns:repeat(auto-fit,minmax(290px,1fr)); gap:18px;\">\n          <sc-for list=\"{{ pillars }}\" as=\"pl\" hint-placeholder-count=\"4\">\n            <div data-reveal=\"\" data-delay=\"{{ pl.delay }}\" style=\"padding:28px 24px; border:1px solid var(--line); border-radius:18px; background:var(--card);\">\n              <div style=\"font-family:'JetBrains Mono',monospace; font-size:11px; letter-spacing:.14em; color:rgba(34,211,238,.55); margin-bottom:16px;\">{{ pl.n }}<\u002Fdiv>\n              <div style=\"font-weight:600; font-size:19px; letter-spacing:-.015em; color:var(--ink); margin-bottom:10px;\">{{ pl.name }}<\u002Fdiv>\n              <div style=\"font-size:14.5px; line-height:1.65; color:var(--soft); text-wrap:pretty;\">{{ pl.text }}<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <section data-screen-label=\"DNA\" style=\"padding:clamp(60px,8vw,110px) clamp(20px,5vw,64px);\">\n      <div style=\"max-width:1160px; margin:0 auto; display:grid; grid-template-columns:repeat(auto-fit,minmax(300px,1fr)); gap:clamp(34px,5vw,64px); align-items:center;\">\n        <div>\n          <h2 data-reveal=\"\" style=\"margin:0 0 20px; max-width:20ch; font-weight:600; letter-spacing:-.028em; line-height:1.06; font-size:clamp(26px,3.4vw,42px); color:var(--ink); text-wrap:balance;\">The DNA anchor<\u002Fh2>\n          <p data-reveal=\"\" data-delay=\"80\" style=\"margin:0 0 20px; max-width:520px; font-size:15.5px; line-height:1.7; color:var(--soft); text-wrap:pretty;\">Analysing any corporate URL produces a structural knowledge profile: tech stack, contact data, SEO metrics, a trust score.<\u002Fp>\n          <p data-reveal=\"\" data-delay=\"140\" style=\"margin:0; max-width:520px; font-size:15.5px; line-height:1.7; color:var(--soft); text-wrap:pretty;\">Every analysis yields a deterministic <code style=\"font-family:'JetBrains Mono',monospace; font-size:14px; color:var(--a1);\">dnaId<\u002Fcode> — the same URL always returns the same hash. That ID is the permanent anchor every later data stream attaches to.<\u002Fp>\n        <\u002Fdiv>\n        <div data-reveal=\"\" data-delay=\"180\" style=\"padding:24px; border:1px solid var(--line); border-radius:18px; background:var(--card);\">\n          <div style=\"padding:12px 14px; border:1px solid rgba(34,211,238,.3); border-radius:10px; background:rgba(34,211,238,.06); font-family:'JetBrains Mono',monospace; font-size:12.5px; color:var(--ink); margin-bottom:20px; word-break:break-all;\">dnaId: a8b7c6d5e4f3…7890<\u002Fdiv>\n          <div style=\"display:grid; grid-template-columns:repeat(auto-fit,minmax(130px,1fr)); gap:18px;\">\n            <sc-for list=\"{{ dnaFacets }}\" as=\"f\" hint-placeholder-count=\"4\">\n              <div>\n                <div style=\"font-family:'JetBrains Mono',monospace; font-size:10.5px; letter-spacing:.12em; text-transform:uppercase; color:var(--faint); margin-bottom:8px;\">{{ f.label }}<\u002Fdiv>\n                <div style=\"font-size:13.5px; line-height:1.6; color:#c9d1de;\">{{ f.value }}<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <section data-screen-label=\"Control\" style=\"padding:clamp(60px,8vw,110px) clamp(20px,5vw,64px); background:#080c16; border-top:1px solid var(--line);\">\n      <div style=\"max-width:1160px; margin:0 auto;\">\n        <h2 data-reveal=\"\" style=\"margin:0 0 clamp(30px,4vw,46px); font-weight:600; letter-spacing:-.028em; font-size:clamp(26px,3.4vw,42px); color:var(--ink);\">Normalisation, intelligence, control<\u002Fh2>\n        <div style=\"display:grid; grid-template-columns:repeat(auto-fit,minmax(270px,1fr)); gap:18px;\">\n          <sc-for list=\"{{ control }}\" as=\"c\" hint-placeholder-count=\"3\">\n            <div data-reveal=\"\" data-delay=\"{{ c.delay }}\" style=\"padding:26px 24px; border:1px solid var(--line); border-radius:18px; background:var(--card);\">\n              <div style=\"font-weight:600; font-size:18px; letter-spacing:-.015em; color:var(--ink); margin-bottom:12px;\">{{ c.name }}<\u002Fdiv>\n              <div style=\"font-size:14.5px; line-height:1.65; color:var(--soft); text-wrap:pretty;\">{{ c.text }}<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <section data-screen-label=\"Trust\" style=\"padding:clamp(60px,8vw,110px) clamp(20px,5vw,64px);\">\n      <div style=\"max-width:1160px; margin:0 auto;\">\n        <h2 data-reveal=\"\" style=\"margin:0 0 14px; font-weight:600; letter-spacing:-.028em; font-size:clamp(26px,3.4vw,42px); color:var(--ink);\">Agents earn their autonomy<\u002Fh2>\n        <p data-reveal=\"\" data-delay=\"70\" style=\"margin:0 0 clamp(30px,4vw,46px); max-width:640px; font-size:15.5px; line-height:1.7; color:var(--soft); text-wrap:pretty;\">Every new agent starts Restricted: strict rate limits, a scope whitelist, read-only where it counts. After 50+ tasks with zero security flags it is promoted to Trusted and broader scopes unlock.<\u002Fp>\n        <div style=\"display:grid; grid-template-columns:repeat(auto-fit,minmax(280px,1fr)); gap:20px;\">\n          <sc-for list=\"{{ tiers }}\" as=\"tr\" hint-placeholder-count=\"2\">\n            <div data-reveal=\"\" data-delay=\"{{ tr.delay }}\" style=\"padding:26px 24px; border:1px solid {{ tr.border }}; border-radius:18px; background:var(--card);\">\n              <div style=\"display:flex; align-items:baseline; justify-content:space-between; gap:12px; margin-bottom:18px;\">\n                <span style=\"font-weight:600; font-size:19px; letter-spacing:-.015em; color:var(--ink);\">{{ tr.name }}<\u002Fspan>\n                <span style=\"font-family:'JetBrains Mono',monospace; font-size:11px; letter-spacing:.1em; color:{{ tr.tint }};\">{{ tr.score }}<\u002Fspan>\n              <\u002Fdiv>\n              <div style=\"height:3px; border-radius:999px; background:rgba(255,255,255,.08); overflow:hidden; margin-bottom:20px;\">\n                <div style=\"{{ tr.bar }}\"><\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"display:flex; flex-direction:column; gap:10px;\">\n                <sc-for list=\"{{ tr.items }}\" as=\"it\" hint-placeholder-count=\"3\">\n                  <div style=\"font-family:'JetBrains Mono',monospace; font-size:12.5px; line-height:1.6; color:var(--soft);\">{{ it }}<\u002Fdiv>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <section data-screen-label=\"Marketplace\" style=\"padding:clamp(60px,8vw,110px) clamp(20px,5vw,64px); background:#080c16; border-top:1px solid var(--line);\">\n      <div style=\"max-width:1160px; margin:0 auto; display:grid; grid-template-columns:repeat(auto-fit,minmax(300px,1fr)); gap:clamp(34px,5vw,64px); align-items:center;\">\n        <div>\n          <h2 data-reveal=\"\" style=\"margin:0 0 20px; max-width:20ch; font-weight:600; letter-spacing:-.028em; line-height:1.06; font-size:clamp(26px,3.4vw,42px); color:var(--ink); text-wrap:balance;\">86+ CLI tools, one click<\u002Fh2>\n          <div style=\"display:flex; flex-direction:column; gap:18px; max-width:520px;\">\n            <sc-for list=\"{{ market }}\" as=\"m\" hint-placeholder-count=\"3\">\n              <div data-reveal=\"\" data-delay=\"{{ m.delay }}\">\n                <div style=\"font-weight:600; font-size:16px; color:var(--ink); margin-bottom:6px;\">{{ m.name }}<\u002Fdiv>\n                <div style=\"font-size:14.5px; line-height:1.65; color:var(--soft); text-wrap:pretty;\">{{ m.text }}<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div data-reveal=\"\" data-delay=\"180\" style=\"padding:22px; border:1px solid var(--line); border-radius:18px; background:rgba(5,7,13,.55); font-family:'JetBrains Mono',monospace; font-size:12.5px; line-height:2; color:var(--soft);\">\n          <div style=\"display:flex; gap:7px; margin-bottom:16px;\">\n            <span style=\"width:9px; height:9px; border-radius:50%; background:rgba(255,255,255,.16);\"><\u002Fspan>\n            <span style=\"width:9px; height:9px; border-radius:50%; background:rgba(255,255,255,.16);\"><\u002Fspan>\n            <span style=\"width:9px; height:9px; border-radius:50%; background:rgba(255,255,255,.16);\"><\u002Fspan>\n          <\u002Fdiv>\n          <div>Fetching dependency…<\u002Fdiv>\n          <div>Compiling agent harness…<\u002Fdiv>\n          <div><span style=\"color:var(--a1);\">Success<\u002Fspan>: tool injected to Vault.<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <section data-screen-label=\"Pricing\" style=\"padding:clamp(60px,8vw,110px) clamp(20px,5vw,64px);\">\n      <div style=\"max-width:1160px; margin:0 auto;\">\n        <h2 data-reveal=\"\" style=\"margin:0 0 clamp(30px,4vw,46px); font-weight:600; letter-spacing:-.028em; font-size:clamp(26px,3.4vw,42px); color:var(--ink);\">Tiers<\u002Fh2>\n        <div style=\"display:grid; grid-template-columns:repeat(auto-fit,minmax(230px,1fr)); gap:18px; align-items:stretch;\">\n          <sc-for list=\"{{ tiersPrice }}\" as=\"tp\" hint-placeholder-count=\"4\">\n            <div data-reveal=\"\" data-delay=\"{{ tp.delay }}\" style=\"{{ tp.style }}\">\n              <sc-if value=\"{{ tp.rec }}\" hint-placeholder-val=\"{{ false }}\">\n                <div style=\"display:inline-flex; padding:5px 11px; border-radius:999px; background:linear-gradient(135deg,var(--a1),var(--a2)); color:#03121a; font-family:'JetBrains Mono',monospace; font-size:10px; letter-spacing:.12em; text-transform:uppercase; margin-bottom:16px;\">recommended<\u002Fdiv>\n              <\u002Fsc-if>\n              <div style=\"font-weight:600; font-size:19px; letter-spacing:-.015em; color:var(--ink); margin-bottom:4px;\">{{ tp.name }}<\u002Fdiv>\n              <div style=\"font-family:'JetBrains Mono',monospace; font-size:13px; color:var(--a1); margin-bottom:18px;\">{{ tp.price }}<\u002Fdiv>\n              <div style=\"font-size:13.5px; line-height:1.75; color:var(--soft); text-wrap:pretty;\">{{ tp.text }}<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <div data-reveal=\"\" data-delay=\"240\" style=\"margin-top:clamp(40px,6vw,64px); padding:clamp(26px,3.5vw,40px); border:1px solid var(--line); border-radius:20px; background:rgba(34,211,238,.05); display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:20px;\">\n          <div>\n            <div style=\"font-weight:600; font-size:clamp(19px,2.2vw,26px); letter-spacing:-.02em; color:var(--ink); margin-bottom:6px;\">Ready to activate your corporate synapse?<\u002Fdiv>\n            <div style=\"font-size:14.5px; color:var(--soft);\">Talk to us about agent manifests and HMAC webhook setup.<\u002Fdiv>\n          <\u002Fdiv>\n          <a href=\"mailto:stefanlietz71@gmail.com?subject=Nexus\" style=\"display:inline-flex; align-items:center; gap:10px; padding:14px 26px; border-radius:999px; font-weight:600; font-size:15px; color:#03121a; background:linear-gradient(135deg,var(--a1),var(--a2)); box-shadow:0 10px 32px rgba(34,211,238,.28); transition:transform .2s;\" style-hover=\"transform:translateY(-2px);\">Initialize Synapse <span style=\"font-size:16px;\">→<\u002Fspan><\u002Fa>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n  <\u002Fdiv>\n  <\u002Fsc-if>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;videoUrl&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;https://www.youtube.com/watch?v=cguTAB5DmvQ&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Video&quot;},&quot;dialStart&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;default&quot;:40,&quot;min&quot;:0,&quot;max&quot;:100,&quot;step&quot;:1,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Story&quot;},&quot;reduceMotion&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Story&quot;}}\">\n/*\n  v2 — rebuilt on the structure of the original landing page, because that one scrolls\n  smoothly: the WebGL field lives INSIDE the hero and is never coupled to scroll position.\n  Nothing in this file writes layout on a scroll event. Concretely:\n    · hero canvas: static base layout + sine drift + edges + travelling signals + turntable,\n      slowly cross-fading between three shapes on a TIMER (not on scroll)\n    · reveals: IntersectionObserver, with a timeout fallback for embedded previews\n    · story visuals: plain DOM (pipeline + dial, countdown, chart) driven by rAF only while\n      they are on screen, using transform/opacity writes only\n*/\nclass Component extends DCLogic {\n  state = { tab: 'story', dial: 40, playing: false };\n\n  constructor(p) {\n    super(p);\n    this.rootRef = React.createRef();\n    this.fieldRef = React.createRef();\n    this.scrimRef = React.createRef();\n    this.wrapRef = React.createRef();\n    this.boxRef = React.createRef();\n    this.coverRef = React.createRef();\n    this.videoRef = React.createRef();\n    this.frameRef = React.createRef();\n    this.pipeRef = React.createRef();\n    this.trackRef = React.createRef();\n    this.dotRef = React.createRef();\n    this.clockRef = React.createRef();\n    this.clockCardRef = React.createRef();\n    this.clockBarRef = React.createRef();\n    this.chartCardRef = React.createRef();\n    this.pathARef = React.createRef();\n    this.pathBRef = React.createRef();\n    this.dotARef = React.createRef();\n    this.dotBRef = React.createRef();\n    // Same-origin MP4 is the reliable path for inline playback — YouTube refuses to embed\n    // this upload from an arbitrary origin. Once the page ships on lietz.pages.dev out of the\n    // same repo, swap this for the relative path './Nexus Demo 01 quer_1080p.mp4'.\n    this.DEFAULT_VIDEO = 'https://www.youtube.com/watch?v=cguTAB5DmvQ';\n    // one shape per story section — the field follows the narrative, not a timer\n    this.SHAPES = ['core', 'scatter', 'network', 'ring', 'dense'];\n    this.SEC = [\n      { shape: 'core', camZ: 208, op: 1.00 },\n      { shape: 'scatter', camZ: 248, op: 0.92 },\n      { shape: 'network', camZ: 226, op: 1.00 },\n      { shape: 'ring', camZ: 198, op: 0.98 },\n      { shape: 'dense', camZ: 208, op: 0.94 },\n      { shape: 'core', camZ: 212, op: 1.00 }\n    ];\n  }\n\n  componentDidMount() {\n    this._reduce = !!this.props.reduceMotion || (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);\n    if (this.props.dialStart != null) this.setState({ dial: Math.max(0, Math.min(100, this.props.dialStart | 0)) });\n    this._onResize = () => { this._sx = null; this._centers = null; this.resize(); };\n    window.addEventListener('resize', this._onResize);\n    this.mountViews();\n  }\n\n  componentDidUpdate(prevProps, prevState) {\n    const tabChanged = prevState && prevState.tab !== this.state.tab;\n    if (tabChanged) window.scrollTo(0, 0);\n    this.setCover();\n    this.applyVideo();\n    this.mountViews(tabChanged || !this._renderer);\n    if (this.state.tab === 'story') this.syncDial();\n  }\n\n  componentWillUnmount() {\n    if (this._raf) cancelAnimationFrame(this._raf);\n    if (this._io) this._io.disconnect();\n    window.removeEventListener('resize', this._onResize);\n    window.removeEventListener('mousemove', this._onMove);\n    this.teardownScene();\n  }\n\n  // The field lives on every tab — only its strength changes, so the info pages stay legible.\n  mountViews(force) {\n    this.initReveal();\n    this._centers = null;\n    if (this.fieldRef.current && (force || !this._renderer)) this.ensureThree(() => this.initScene());\n    if (!this._raf) this._tick();\n    if (this.scrimRef.current) {\n      this.scrimRef.current.style.background = this.state.tab === 'story'\n        ? 'radial-gradient(150% 110% at 58% 42%, rgba(5,7,13,.42) 30%, rgba(5,7,13,.74) 100%)'\n        : 'radial-gradient(150% 110% at 58% 42%, rgba(5,7,13,.72) 30%, rgba(5,7,13,.9) 100%)';\n    }\n    if (this.state.tab === 'story') {\n      this.setCover();\n      this.applyVideo();\n      this.initChart();\n      this.observeVisible();\n      this.syncDial();\n    }\n  }\n\n  /* ---------- video ---------- */\n  _url() { return this.props.videoUrl != null && this.props.videoUrl !== '' ? this.props.videoUrl : this.DEFAULT_VIDEO; }\n  _ytId(u) { const m = String(u || '').match(/(?:shorts\\/|watch\\?v=|youtu\\.be\\/|embed\\/|live\\/)([A-Za-z0-9_-]{6,})/); return m ? m[1] : ''; }\n  applyVideo() {\n    const url = this._url(), file = !this._ytId(url);\n    const v = this.videoRef.current;\n    if (v && file) {\n      if (v.getAttribute('src') !== url) v.setAttribute('src', url);\n      // Valueless boolean attributes don't survive the template, so set the props directly.\n      v.controls = true; v.playsInline = true; v.muted = false;\n      if (!v._nx) {\n        v._nx = 1;\n        v.addEventListener('play', () => { if (!this.state.playing) this.setState({ playing: true }); });\n        v.addEventListener('pause', () => { if (v.currentTime === 0 || v.ended) this.setState({ playing: false }); });\n      }\n    }\n    this.applyAspect();\n  }\n\n  playFile() {\n    const v = this.videoRef.current;\n    this.setState({ playing: true });\n    if (v) { v.controls = true; try { v.play(); } catch (e) {} }\n  }\n  play() { this.setState({ playing: true }); }\n\n  // A Shorts upload is portrait footage inside a 16:9 canvas, and its thumbnail can't be\n  // changed from here — so the frame goes 9:16 and the poster is scaled by the exact factor\n  // that crops the black pillarbox bars away (16:9 ÷ 9:16 = 3.16). Deterministic, no pixel\n  // probing: the URL already tells us the orientation.\n  _portrait() { return /\\/shorts\\//.test(this._url()); }\n\n  setCover() {\n    const el = this.coverRef.current, id = this._ytId(this._url());\n    if (!el || !id || el._poster === id) return;\n    el._poster = id;\n    const load = (name, next) => {\n      const img = new Image();\n      img.onload = () => { if (img.naturalWidth > 200) el.style.backgroundImage = 'url(' + img.src + ')'; else if (next) next(); };\n      img.onerror = () => { if (next) next(); };\n      img.src = 'https://i.ytimg.com/vi/' + id + '/' + name + '.jpg';\n    };\n    load('maxresdefault', () => load('sddefault', () => load('hqdefault', null)));\n    this.applyAspect();\n  }\n\n  applyAspect() {\n    const portrait = this._portrait();\n    const scale = 3.16;\n    const cov = this.coverRef.current, box = this.boxRef.current, wrap = this.wrapRef.current, fr = this.frameRef.current;\n    if (cov) cov.style.backgroundSize = portrait ? (scale * 100).toFixed(0) + '% auto' : 'cover';\n    if (box) box.style.aspectRatio = portrait ? '9 / 16' : '16 / 9';\n    if (wrap) wrap.style.width = portrait ? 'min(100%,300px)' : 'min(100%,540px)';\n    if (fr) {\n      if (portrait) {\n        fr.style.inset = 'auto'; fr.style.left = '50%'; fr.style.top = '50%';\n        fr.style.width = (scale * 100).toFixed(0) + '%';\n        fr.style.height = (scale * 100).toFixed(0) + '%';\n        fr.style.transform = 'translate(-50%,-50%)';\n      } else {\n        fr.style.inset = '0'; fr.style.left = ''; fr.style.top = '';\n        fr.style.width = '100%'; fr.style.height = '100%'; fr.style.transform = '';\n      }\n    }\n  }\n\n  /* ---------- reveal ---------- */\n  initReveal() {\n    const root = this.rootRef.current; if (!root) return;\n    const els = Array.prototype.slice.call(root.querySelectorAll('[data-reveal]')).filter(e => !e._rv);\n    if (!els.length) return;\n    if (this._reduce) { els.forEach(e => { e._rv = 1; e.style.opacity = '1'; e.style.transform = 'none'; }); return; }\n    const show = (e) => { const d = parseInt(e.getAttribute('data-delay') || '0', 10) || 0; e.style.transitionDelay = d + 'ms'; e.style.opacity = '1'; e.style.transform = 'none'; };\n    els.forEach(e => { e._rv = 1; e.style.opacity = '0'; e.style.transform = 'translateY(22px)'; e.style.transition = 'opacity .8s cubic-bezier(.2,.7,.2,1), transform .8s cubic-bezier(.2,.7,.2,1)'; });\n    if (!this._io && 'IntersectionObserver' in window) {\n      this._io = new IntersectionObserver((entries) => {\n        entries.forEach(en => { if (en.isIntersecting) { show(en.target); this._io.unobserve(en.target); } });\n      }, { rootMargin: '0px 0px -12% 0px', threshold: 0.01 });\n    }\n    if (this._io) els.forEach(e => this._io.observe(e));\n    const vh = window.innerHeight || 800;\n    requestAnimationFrame(() => els.forEach(e => { if (e.getBoundingClientRect().top < vh * 0.95) show(e); })
